# p1 boot FAT (A/B via os_prefix), p2/p3 rootfs, p4 extended, p5 /factory, p6 /data.
# >4 partitions -> genimage auto-creates the extended container (p4).
# boot.vfat + factory.vfat come from post-image.sh.

image data.f2fs {
	f2fs {
		label = "data"
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 1M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition factory {
		partition-type = 0xC
		image = "factory.vfat"
		size = 32M
	}

	partition data {
		partition-type = 0x83
		image = "data.f2fs"
	}
}
