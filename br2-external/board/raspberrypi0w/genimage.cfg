# p1 boot FAT (A/B via os_prefix), p2/p3 rootfs, p4 /data. FAT from post-image.sh.

image data.f2fs {
	f2fs {
		label = "data"
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 1M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.f2fs"
	}
}
