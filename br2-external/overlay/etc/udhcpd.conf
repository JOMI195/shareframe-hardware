# udhcpd config for usb0 (board side). Board = 10.55.0.1, hands plugged-in host
# 10.55.0.2. Single lease: one client = the host on the other end of the cable.

start           10.55.0.2
end             10.55.0.2
interface       usb0
max_leases      1
lease_file      /run/udhcpd.leases
opt subnet      255.255.255.0
# No router/dns opt: no NAT and no resolver on usb0, would black-hole the host.
opt lease       86400
