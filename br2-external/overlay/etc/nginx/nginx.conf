# shareframe reverse proxy.
#
# Serves the static dashboard SPA on :80 and reverse-proxies /api/ to the
# local backend (127.0.0.1:8080). When the backend is down it returns a
# custom shareframe-styled 502 page instead of nginx's default error.
#
# Rootfs is a read-only squashfs (RAUC A/B): the ONLY writable locations are
# tmpfs (/run, /tmp). All of nginx's runtime scratch (pid, temp paths) must
# therefore live there. Errors go to syslog (/var/log/messages), where the
# dashboard's system log and the diagnostics package read them.

user root;
worker_processes 1;
pid /run/nginx.pid;
error_log syslog:server=unix:/dev/log,tag=nginx warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # The dashboard build ships .gz next to each asset, so the Pi doesn't compress per request.
    gzip_static on;
    gzip_vary on;

    # The names the board answers to: its addresses, localhost and its mDNS name. A page on any
    # other name that rebinds its DNS to the board would otherwise reach the API as same-origin.
    map $host $sf_own_host {
        default                                   0;
        ~^[0-9.]+$                                1;
        ~^\[[0-9a-fA-F:.]+\]$                     1;
        localhost                                 1;
        "~*^shareframe-board(-[0-9a-f]{4})?\.local$" 1;
        # A build adds its own names here (the simulator's test runner); empty on the board.
        include /etc/nginx/own-hosts.d/*.conf;
    }

    # Writable scratch on tmpfs (read-only rootfs).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # No keepalive: the backend answers one request per connection.
    upstream dashboard_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/shareframe/dashboard-frontend;
        index index.html;
        include /etc/nginx/security-headers.conf;

        # Any other name (a captive-portal probe, a router's DNS name for the board) goes to the
        # address the request came in on: 192.168.4.1 on the hotspot, the LAN address otherwise.
        if ($sf_own_host = 0) {
            return 302 http://$server_addr/;
        }

        # The dashboard's requests are small JSON. The backend would inflate a gzip body without a
        # limit, so the size is capped here and the encoding never reaches it.
        client_max_body_size 64k;

        # Reverse-proxy the API to the local backend.
        location /api/ {
            proxy_pass http://dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Encoding "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            include /etc/nginx/errors-json.conf;
        }

        # Diagnostics collect + upload; the client retries an unreachable backend.
        location = /api/system/diagnostics {
            proxy_pass http://dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Encoding "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 180s;
            include /etc/nginx/errors-json.conf;
        }

        # Captive-portal detection. In AP fallback mode dnsmasq resolves every
        # name to the board, so the OS connectivity probes (Android/iOS/Windows)
        # land here. Redirecting them to the board's address makes the captive
        # popup open the dashboard there.
        location = /generate_204            { return 302 http://$server_addr/; }
        location = /gen_204                 { return 302 http://$server_addr/; }
        location = /hotspot-detect.html     { return 302 http://$server_addr/; }
        location = /library/test/success.html { return 302 http://$server_addr/; }
        location = /ncsi.txt                { return 302 http://$server_addr/; }
        location = /connecttest.txt         { return 302 http://$server_addr/; }
        location = /redirect                { return 302 http://$server_addr/; }

        # SPA: serve static files, fall back to index.html for client routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # An update replaces it in place, so the browser asks again on every load.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Named by their content hash: a new build brings new names.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # UPnP description.xml, generated at boot by the ssdpd run script.
        location /ssdp/ {
            alias /run/shareframe/ssdp/;
        }

        location ^~ /__errors/ {
            internal;
            alias /usr/share/shareframe/errors/;
        }
    }
}
