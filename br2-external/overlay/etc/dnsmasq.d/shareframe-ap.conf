# DHCP + captive-portal DNS for the wlan0 AP fallback. Scoped to wlan0 with
# bind-interfaces so it never touches usb0 (served by udhcpd) or wlan0 while
# it is a station. Only started (by wifi-mode-manager via shareframe-ap) while
# the board is hosting its access point.
interface=wlan0
bind-interfaces
no-resolv
no-hosts
dhcp-authoritative
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
# Wildcard DNS: resolve every name to the board so OS captive-portal probes
# get redirected to the dashboard (nginx serves a 302 to /).
address=/#/192.168.4.1
