# dhcpcd configuration for shareframe-board.
# Tuned for flaky / weak / lossy wifi: patient initial DHCP, fast rebind on
# reassociation, IPv6 SLAAC, DNS fallback via 90-dns-fallback hook.

# Send hostname from /etc/hostname in DHCP request.
hostname

# MAC-based client id: /var is tmpfs so a stored DUID would regenerate every
# boot and the DHCP server would hand out a new lease each time.
clientid

# Persist lease across dhcpcd restarts so reassociation rebinds fast.
persistent

# IPv6 SLAAC with privacy extensions (works on IPv6-only nets).
slaac private

# Patient initial DHCP. Default 30s is too tight on lossy/weak wifi where
# DISCOVER/OFFER packets get dropped — wait up to 60s before going link-local.
timeout 60

# Fast rebind after reassociation / link flap.
reboot 5

# Skip ARP probe (wastes time on lossy nets, and shareframe is sole client).
noarp

# Only manage wlan0. usb0 has its own static config + udhcpd server.
allowinterfaces wlan0

# ipv4ll (RFC 3927 link-local fallback) is on by default in dhcpcd 10.x;
# no explicit option needed. Disable with `noipv4ll` if undesired.
