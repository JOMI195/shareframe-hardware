# ACT LED blink code overrides, sourced by shareframe-led as shell
# assignments (no other shell constructs). Defaults shown commented out.
# Per-device overrides go in /data/shareframe/led.conf (sourced after this
# file and wins). See docs/led-status-codes.md.

# Timings (ms)
#SHORT=200          # short blink on-time
#LONG=800           # long blink on-time
#GAP=300            # off-time between blinks
#CYCLE=2000         # off-time marking the pattern restart
#NORMAL_CYCLE=9800  # restart gap of the normal sign-of-life blink

# Per-state codes: "<#long blinks> <#short blinks>"
#NORMAL="0 1"
#WIFI_CONNECTING="0 2"
#WIFI_DOWN="0 3"
#AP_MODE="0 4"
#UPDATING="1 0"
#PROTECTED="2 0"
