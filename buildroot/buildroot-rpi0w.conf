BR2_arm=y
BR2_arm1176jzf_s=y
BR2_TOOLCHAIN_EXTERNAL=y
BR2_TOOLCHAIN_EXTERNAL_CUSTOM=y
BR2_TOOLCHAIN_EXTERNAL_PATH="../../toolchain/src"
BR2_TOOLCHAIN_EXTERNAL_CUSTOM_PREFIX="arm-buildroot-linux-musleabihf"
BR2_TOOLCHAIN_EXTERNAL_GCC_14=y
BR2_TOOLCHAIN_EXTERNAL_HEADERS_5_4=y
BR2_TOOLCHAIN_EXTERNAL_CUSTOM_MUSL=y
BR2_TOOLCHAIN_EXTERNAL_CXX=y
BR2_TOOLCHAIN_EXTERNAL_OPENMP=y
BR2_GLOBAL_PATCH_DIR="$(BR2_EXTERNAL_SHAREFRAME_PATH)/patches"
BR2_DOWNLOAD_FORCE_CHECK_HASHES=y
# --- Init: s6 als PID1
BR2_INIT_NONE=y
BR2_PACKAGE_SHAREFRAME_INIT=y
BR2_TARGET_GENERIC_HOSTNAME="shareframe-board"
BR2_TARGET_GENERIC_ISSUE="Welcome to Shareframe-board"
BR2_TARGET_GENERIC_ROOT_PASSWD="root"
BR2_SYSTEM_DHCP=""
BR2_ROOTFS_OVERLAY="../../overlay"
BR2_ROOTFS_POST_BUILD_SCRIPT="../../scripts/post-build.sh"
BR2_ROOTFS_POST_FAKEROOT_SCRIPT="../../scripts/inter-build.sh"
BR2_ROOTFS_POST_SCRIPT_ARGS="$(BR2_DEFCONFIG)"
BR2_LINUX_KERNEL=y
BR2_LINUX_KERNEL_CUSTOM_VERSION=y
BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="6.18.12"
BR2_LINUX_KERNEL_USE_DEFCONFIG=y
BR2_LINUX_KERNEL_DEFCONFIG="bcm2835"
BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES="../../fragments/kernel-localversion-const.fragment ../../fragments/kernel-localversion.fragment"
BR2_LINUX_KERNEL_DTS_SUPPORT=y
BR2_LINUX_KERNEL_INTREE_DTS_NAME="broadcom/bcm2835-rpi-zero-w"
BR2_LINUX_KERNEL_NEEDS_HOST_OPENSSL=y
BR2_LINUX_KERNEL_INSTALL_TARGET=y
BR2_TARGET_UBOOT=y
BR2_TARGET_UBOOT_LATEST_VERSION=y
BR2_TARGET_UBOOT_USE_DEFCONFIG=y
BR2_TARGET_UBOOT_BOARD_DEFCONFIG="rpi_0_w"
BR2_TARGET_UBOOT_CONFIG_FRAGMENT_FILES="../../fragments/uboot-usbether.fragment"
BR2_TARGET_UBOOT_FORMAT_BIN=y
BR2_PACKAGE_BUSYBOX_CONFIG="../../busybox/busybox.conf"
BR2_PACKAGE_RPI_FIRMWARE=y
BR2_PACKAGE_RPI_FIRMWARE_BOOTCODE_BIN=y
BR2_PACKAGE_RPI_FIRMWARE_VARIANT_PI=y
BR2_PACKAGE_RPI_FIRMWARE_CONFIG_FILE="../../firmware-config/config.txt"
BR2_PACKAGE_DROPBEAR=y
BR2_PACKAGE_BRCMFMAC_SDIO_FIRMWARE_RPI=y
BR2_PACKAGE_BRCMFMAC_SDIO_FIRMWARE_RPI_WIFI=y
BR2_PACKAGE_WPA_SUPPLICANT=y
BR2_PACKAGE_WPA_SUPPLICANT_NL80211=y
BR2_PACKAGE_WPA_SUPPLICANT_CLI=y
BR2_PACKAGE_WPA_SUPPLICANT_PASSPHRASE=y
# --- Production rootfs: read-only squashfs slot (overlayed by initramfs /init)
BR2_TARGET_ROOTFS_SQUASHFS=y
BR2_TARGET_ROOTFS_SQUASHFS4_ZSTD=y
BR2_PACKAGE_SHAREFRAME_INITRAMFS=y
# --- SD image (genimage) + /data partition
BR2_ROOTFS_POST_IMAGE_SCRIPT="$(BR2_EXTERNAL_SHAREFRAME_PATH)/board/raspberrypi0w/post-image.sh"
BR2_PACKAGE_HOST_GENIMAGE=y
BR2_PACKAGE_HOST_DOSFSTOOLS=y
BR2_PACKAGE_HOST_MTOOLS=y
BR2_PACKAGE_HOST_E2FSPROGS=y
# --- A/B updates: RAUC + U-Boot tools (fw_setenv, mkenvimage)
BR2_PACKAGE_RAUC=y
BR2_PACKAGE_HOST_RAUC=y
BR2_PACKAGE_UBOOT_TOOLS=y
BR2_PACKAGE_HOST_UBOOT_TOOLS=y
BR2_PACKAGE_SHAREFRAME_RAUC=y
BR2_PACKAGE_SHAREFRAME_SERVICES=y
BR2_PACKAGE_SYSINFO=y
