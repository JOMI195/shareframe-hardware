[system]
compatible=shareframe-pi0w
bootloader=custom
bundle-formats=verity
data-directory=/data/rauc
statusfile=/data/rauc/status.ini

[handlers]
bootloader-custom-backend=/usr/lib/rauc/tryboot-backend

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=raw
bootname=B

# Boot "slots" are the A/ and B/ subdirs of the shared boot FAT (p1); the
# bundle's slot-install hook writes them, the device here is informational.
[slot.boot.0]
device=/dev/mmcblk0p1
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/mmcblk0p1
type=vfat
parent=rootfs.1
