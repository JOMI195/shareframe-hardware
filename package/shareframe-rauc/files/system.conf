[system]
compatible=shareframe-pi0w
bootloader=uboot
bundle-formats=plain
data-directory=/data/rauc
statusfile=/data/rauc/status.ini
boot-attempts=3

[keyring]
path=/etc/rauc/ca.cert.pem

[handlers]
post-install=/etc/rauc/post-install.sh

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=raw
bootname=B
