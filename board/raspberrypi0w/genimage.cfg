# A/B layout: p1 single boot FAT (firmware + config.txt/tryboot.txt + A/ B/
# kernel sets via os_prefix), p2/p3 rootfs slots, p4 /data (grown to full card
# by the expand-data oneshot on first boot). boot.vfat built by post-image.sh.

image data.f2fs {
	f2fs {
		label = "data"
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 1M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.f2fs"
	}
}
