# udhcpd config for usb0 (board side). Hands the plugged-in host 10.55.0.1/24
# so it gets a known IP and can `ssh root@10.55.0.2`. Single lease: one client
# = the host on the other end of the cable.

start           10.55.0.1
end             10.55.0.1
interface       usb0
max_leases      1
lease_file      /run/udhcpd.leases
opt subnet      255.255.255.0
opt router      10.55.0.2
opt dns         10.55.0.2
opt lease       86400
