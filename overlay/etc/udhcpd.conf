# udhcpd config for usb0 (board side). Hands the laptop 10.55.0.1/24 so
# the user gets a known IP after plugging in and can `ssh root@10.55.0.2`.
#
# Only single-lease (one client = the laptop on the other end of the cable).
# Gated by /etc/shareframe-mode; in dev mode usb0 is owned by U-Boot TFTP path
# instead, so the longrun stays parked.

start           10.55.0.1
end             10.55.0.1
interface       usb0
max_leases      1
lease_file      /var/lib/misc/udhcpd.leases
opt subnet      255.255.255.0
opt router      10.55.0.2
opt dns         10.55.0.2
opt lease       86400
