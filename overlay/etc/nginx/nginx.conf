# shareframe reverse proxy.
#
# Serves the static dashboard SPA on :80 and reverse-proxies /api/ to the
# local backend (127.0.0.1:8080). When the backend is down it returns a
# custom shareframe-styled 502 page instead of nginx's default error.
#
# Rootfs is a read-only squashfs (RAUC A/B): the ONLY writable locations are
# tmpfs (/run, /tmp). All of nginx's runtime scratch (pid, temp paths) must
# therefore live there. Logs go to stderr (captured by the s6 supervisor).

user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Writable scratch on tmpfs (read-only rootfs).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    upstream dashboard_backend {
        server 127.0.0.1:8080;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/shareframe/dashboard-frontend;
        index index.html;

        # Reverse-proxy the API to the local backend.
        location /api/ {
            proxy_pass http://dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;

            # Backend down / upstream 5xx -> shareframe 502 page.
            proxy_intercept_errors on;
            error_page 502 503 504 @backend_down;
        }

        # SPA: serve static files, fall back to index.html for client routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets for the error page (served even when backend is down).
        location /error-assets/ {
            alias /usr/share/shareframe/error/;
        }

        location @backend_down {
            internal;
            root /usr/share/shareframe/error;
            try_files /502.html =502;
        }
    }
}
